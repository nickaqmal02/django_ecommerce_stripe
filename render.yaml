services:
  - type: web
    name: your-shop
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn shopconfig.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: your-shop.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAILTRAP_HOST
        value: sandbox.smtp.mailtrap.io
      - key: MAILTRAP_PORT
        value: "587"
      - key: MAILTRAP_USERNAME
        sync: false
      - key: MAILTRAP_PASSWORD
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
